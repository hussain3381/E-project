<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful | OceanGate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./src/css/style.css">
    
    <style>
        /* Thank You Page Specific Premium Dark Styling */
        .thank-you-body {
            background-color: #040407;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Cyber Grid Background Effect */
        .thank-you-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(4, 4, 7, 0.85) 0%, rgba(15, 4, 4, 0.95) 100%), 
                        url('../src/img/banners/images.jpg') center/cover no-repeat;
            opacity: 0.3;
            z-index: 1;
        }

        .success-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 4, 4, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 77, 77, 0.2);
            border-radius: 16px;
            padding: 45px 30px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8);
            max-width: 550px;
            width: 100%;
        }

        /* Glowing Neon Success Icon Ring */
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(255, 77, 77, 0.1);
            border: 2px solid #ff4d4d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.4);
            animation: pulseGlow 2s infinite;
        }

        .icon-box i {
            color: #ff4d4d;
            font-size: 2.2rem;
        }

        .success-card h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #ff8080);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-card p {
            color: #cccccc;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Countdown Redirect Notice Text */
        .redirect-notice {
            font-size: 0.9rem;
            color: #8c8c8c;
            border-top: 1px solid rgba(255, 77, 77, 0.1);
            padding-top: 20px;
            margin-top: 20px;
        }

        #countdown {
            color: #ff4d4d;
            font-weight: 700;
        }

        /* CSS Button Grid Fix overrides */
        .btn-cyber-outline {
            color: #ffffff;
            border: 1px solid rgba(255, 77, 77, 0.4);
            padding: 10px 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .btn-cyber-outline:hover {
            background-color: #ff4d4d;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
            transform: translateY(-2px);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }
    </style>
</head>
<body class="thank-you-body">

    <div class="container d-flex justify-content-center px-3">
        <div class="success-card text-center" data-aos="zoom-in">
            <div class="icon-box">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            
            <h1>Transmission Sent</h1>
            <p>
                Dear User, your message has been successfully encrypted and delivered to the OceanGate secure matrix portal. Our technical team will contact you shortly.
            </p>

            <a href="./shop.html" class="btn btn-cyber-outline">
                <i class="fa-solid fa-arrow-left me-2"></i> Return To Shop
            </a>

            <div class="redirect-notice">
                You will be automatically redirected to the portal in <span id="countdown">10</span> seconds...
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 10; // Seconds countdown clock
        const countdownElement = document.getElementById('countdown');

        const downloadTimer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(downloadTimer);
                window.location.href = "./shop.html"; // Redirect targeted terminal file
            }
        }, 1000);
    </script>

</body>
</html>
